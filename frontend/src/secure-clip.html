<div id="container">
  <div id="controls">
    <div class="field-group passphrase-field-group">
      <label for="passphrase-field">passphrase</label>
      <div id="passphrase-wrap">
        <input id="passphrase-field" type="password" autocomplete="current-password" />
        <button
          id="passphrase-toggle"
          type="button"
          aria-label="Show passphrase"
          aria-pressed="false"
        >
        </button>
        <button id="passphrase-dice" type="button" aria-label="Randomize passphrase"></button>
        <button id="passphrase-qr" type="button" aria-label="Scan QR code"></button>
        <button id="passphrase-help" type="button" aria-label="Help"></button>
      </div>
    </div>
  </div>
  <div id="text-wrap">
    <textarea spellcheck="false" id="text-field" aria-label="Clipboard text"></textarea>
  </div>
</div>
<div id="qr-backdrop" hidden>
  <div id="qr-popover"></div>
</div>
