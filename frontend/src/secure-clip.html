<div id="container">
  <div id="controls">
    <div class="field-group id-field-group">
      <label for="id-field">id</label>
      <input id="id-field" type="text" autocomplete="off" />
    </div>
    <div class="field-group password-field-group">
      <label for="password-field">password</label>
      <div id="password-wrap">
        <input id="password-field" type="password" autocomplete="current-password" />
        <button id="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
  </div>
  <div id="text-wrap">
    <textarea spellcheck=false id="text-field" aria-label="Clipboard text"></textarea>
  </div>
</div>
